spring.application.name=pulsepass

# JPA y Hibernate: Solo validar el esquema frente a las migraciones de Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ------------------------------------------------------------------
# Seguridad / JWT (PRD Capa de Seguridad §9)
# El secreto NUNCA se escribe aquí: se inyecta desde PULSEPASS_JWT_SECRET_BASE64 (>= 32 bytes,
# Base64). Si la variable falta o es corta, JwtProperties hace fallar el arranque (deny-by-default).
# ------------------------------------------------------------------
pulsepass.security.jwt.issuer=${PULSEPASS_JWT_ISSUER:pulsepass-api}
pulsepass.security.jwt.secret-base64=${PULSEPASS_JWT_SECRET_BASE64:}
pulsepass.security.jwt.access-token-ttl=${PULSEPASS_ACCESS_TOKEN_TTL:PT15M}

# ------------------------------------------------------------------
# NFR-SEC-008: CORS parametrizado. Lista de orígenes separados por comas;
# por defecto vacía -> ningún origen cross-origin permitido (deny-by-default).
# ------------------------------------------------------------------
pulsepass.security.cors.allowed-origins=${PULSEPASS_CORS_ALLOWED_ORIGINS:}

# ------------------------------------------------------------------
# NFR-SEC-006: correlación de logs. RequestIdFilter deposita el id de cada
# solicitud en el MDC ("requestId") y el patrón de consola lo muestra en todas
# las líneas, de modo que login y denegaciones 401/403 quedan correlacionados.
# ------------------------------------------------------------------
logging.pattern.correlation=[%X{requestId}]